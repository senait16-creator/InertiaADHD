<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Usage — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="dashboard">
    <a href="#" class="back-link" id="back-link">‹ Products</a>

    <header class="dashboard-header">
      <h1 id="item-name"></h1>
      <p class="subtitle" id="item-meta"></p>
    </header>

    <div class="hair-form">
      <a href="#" class="link-chip" id="item-link" style="margin-bottom:0.9rem; display:inline-flex;"></a>

      <form id="usage-form">
        <div class="field">
          <span class="field-label">Routine Step (where it's used)</span>
          <div class="chip-group" id="u-routine-step"></div>
          <p class="field-note" id="u-routine-step-empty" hidden>No routine steps yet — add some from the routine page first.</p>
        </div>
        <label>
          Rating (out of 10)
          <input type="number" id="u-rating" min="1" max="10" step="1">
        </label>
        <label>
          Performance Notes
          <textarea id="u-notes" rows="4" placeholder="How does it perform here specifically?"></textarea>
        </label>
        <div class="field">
          <span class="field-label">Repurchase? (for this use)</span>
          <div class="segmented" id="u-repurchase">
            <button type="button" data-value="Yes" aria-pressed="false">Yes</button>
            <button type="button" data-value="Maybe" aria-pressed="false">Maybe</button>
            <button type="button" data-value="No" aria-pressed="false">No</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="delete-usage" style="margin-right:auto; color:var(--danger);">Remove from this routine</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/maintenanceProduct.js"></script>
</body>
</html>
