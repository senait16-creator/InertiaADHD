<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Routine History — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <main class="dashboard">
    <a href="#" class="back-link" id="back-link">‹ Back</a>

    <header class="dashboard-header">
      <h1 id="page-title">Routine — History</h1>
      <p class="subtitle">Every real change gets its own version. A quick fix doesn't.</p>
    </header>

    <div class="version-timeline" id="timeline"></div>
    <p class="subtitle" id="empty-note" hidden>No history yet — edit your routine to start one.</p>
  </main>

  <script type="module" src="js/maintenanceHistory.js"></script>
