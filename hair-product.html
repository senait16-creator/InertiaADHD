<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Product — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="dashboard">
    <a href="hair-products.html" class="back-link">‹ Products</a>

    <header class="dashboard-header">
      <h1 id="product-name"></h1>
      <p class="subtitle" id="product-meta"></p>
    </header>

    <div class="hair-form">
      <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem;">
        <div class="sticker-badge hero" id="item-sticker-preview">🏷️</div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button type="button" class="btn-secondary" id="choose-sticker-btn">Choose Sticker</button>
          <button type="button" class="btn-secondary" id="create-sticker-btn">+ Create New</button>
        </div>
      </div>

      <a href="#" class="link-chip" id="item-link" style="margin-bottom:0.9rem; display:inline-flex;"></a>

      <div id="insight-slot"></div>

      <div class="stat-tile-row" id="stat-tiles"></div>
      <div class="stat-tile-row" id="cost-stats"></div>

      <div class="field">
        <span class="field-label">Lessons that mention this product</span>
        <div class="stack" id="related-lessons"></div>
      </div>

      <div class="field">
        <span class="field-label">Used In</span>
        <div class="stack" id="usage-list"></div>
        <p class="field-note" id="usage-empty-note" hidden>Not in Hair Routine yet — add it from Hair's Active Routine.</p>
      </div>

      <form id="product-form">
        <div class="section-divider"></div>
        <label>
          Rating (out of 10)
          <input type="number" id="p-rating" min="1" max="10" step="1">
        </label>
        <div class="field">
          <span class="field-label">Notes (how it performs for hair)</span>
          <textarea id="p-notes" rows="4"></textarea>
        </div>
        <div class="field">
          <span class="field-label">Repurchase?</span>
          <div class="segmented" id="p-repurchase">
            <button type="button" data-value="Yes" aria-pressed="false">Yes</button>
            <button type="button" data-value="Maybe" aria-pressed="false">Maybe</button>
            <button type="button" data-value="No" aria-pressed="false">No</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="delete-product" style="margin-right:auto; color:var(--danger);">Delete</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/hairProduct.js"></script>
</body>
</html>
