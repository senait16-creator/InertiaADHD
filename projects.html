<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="dashboard">
    <a href="index.html" class="back-link">‹ Back</a>

    <header class="dashboard-header">
      <h1>Projects</h1>
      <p class="subtitle">Continue where you left off.</p>
    </header>

    <div class="project-grid" id="project-grid">
      <button class="project-card add-project-card" id="add-project-card" type="button">
        <div class="add-icon">+</div>
        <div class="add-label">Add a Project</div>
      </button>
    </div>
  </main>

  <div class="modal-overlay" id="add-project-modal">
    <div class="modal">
      <h2>Add a Project</h2>
      <form id="add-project-form">
        <label>
          Project name
          <input type="text" id="project-name" required maxlength="80" autocomplete="off">
        </label>
        <div class="field">
          <span class="field-label">Icon</span>
          <div class="icon-picker" id="project-icon-picker" role="radiogroup" aria-label="Project icon"></div>
        </div>
        <label>
          Status (optional)
          <input type="text" id="project-status" maxlength="60" autocomplete="off">
        </label>
        <div class="field">
          <span class="field-label">Color (optional)</span>
          <div class="color-picker" id="project-color-picker" role="radiogroup" aria-label="Project color">
            <button type="button" class="color-swatch" data-color="sage" role="radio" aria-checked="true" aria-label="Sage"></button>
            <button type="button" class="color-swatch" data-color="green" role="radio" aria-checked="false" aria-label="Green"></button>
            <button type="button" class="color-swatch" data-color="blue" role="radio" aria-checked="false" aria-label="Blue"></button>
            <button type="button" class="color-swatch" data-color="amber" role="radio" aria-checked="false" aria-label="Amber"></button>
            <button type="button" class="color-swatch" data-color="lavender" role="radio" aria-checked="false" aria-label="Lavender"></button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-add">Cancel</button>
          <button type="submit" class="btn-primary">Add Project</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/projects.js"></script>
</body>
</html>
