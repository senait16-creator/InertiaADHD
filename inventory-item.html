<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Item — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="dashboard">
    <a href="#" class="back-link" id="back-link">‹ Items</a>

    <header class="dashboard-header">
      <h1 id="item-name"></h1>
      <p class="subtitle" id="item-meta"></p>
    </header>

    <div class="hair-form">
      <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem;">
        <div class="sticker-badge hero" id="item-sticker-preview">🏷️</div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button type="button" class="btn-secondary" id="choose-sticker-btn">Choose Sticker</button>
          <button type="button" class="btn-secondary" id="create-sticker-btn">+ Create New</button>
        </div>
      </div>
      <form id="item-form">
        <label>
          Name
          <input type="text" id="i-name" required maxlength="80" autocomplete="off">
        </label>
        <label>
          Brand
          <input type="text" id="i-brand" maxlength="60" autocomplete="off">
        </label>
        <label>
          Category
          <input type="text" id="i-category" maxlength="60" autocomplete="off">
        </label>
        <label>
          Size
          <input type="text" id="i-size" maxlength="60" autocomplete="off" placeholder="e.g. 8 oz">
        </label>
        <div class="field">
          <span class="field-label">Status</span>
          <div class="chip-group" id="i-status"></div>
        </div>
        <label>
          Source URL <span class="field-note" style="display:inline; margin:0;">(a reference only — not where the sticker comes from)</span>
          <input type="text" id="i-url" autocomplete="off" placeholder="https://…">
        </label>
        <label>
          Notes
          <textarea id="i-notes" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="delete-item" style="margin-right:auto; color:var(--danger);">Delete</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>

      <div class="section-divider"></div>

      <div class="field">
        <span class="field-label">Photos</span>
        <div class="gallery-grid" id="photo-grid"></div>
        <p class="field-note" id="photo-empty-note" hidden>No photos yet.</p>
        <button type="button" class="add-row-btn" id="add-photo-btn" style="margin-top:0.7rem;">+ Add Photo</button>
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
      </div>

      <div class="section-divider"></div>

      <div class="field">
        <span class="field-label">Purchases</span>
        <div class="stack" id="purchase-list"></div>
        <p class="field-note" id="purchase-empty-note" hidden>No purchases logged yet.</p>
        <button type="button" class="add-row-btn" id="add-purchase-btn" style="margin-top:0.7rem;">+ Add Purchase</button>
      </div>

      <div class="section-divider"></div>

      <div class="field">
        <span class="field-label">Used In</span>
        <div class="stack" id="usage-list"></div>
        <p class="field-note" id="usage-empty-note" hidden>Not in any current routine yet — add it from a Maintenance area's Active Routine.</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="purchase-modal">
    <div class="modal">
      <h2 id="purchase-modal-title">Add Purchase</h2>
      <form id="purchase-form">
        <label>
          Purchase Date
          <input type="date" id="pu-purchase-date">
        </label>
        <label>
          Purchase Price
          <input type="number" id="pu-purchase-price" min="0" step="0.01">
        </label>
        <label>
          Purchase Location
          <input type="text" id="pu-purchase-location" maxlength="80" autocomplete="off">
        </label>
        <label>
          Date Started
          <input type="date" id="pu-date-started">
        </label>
        <label>
          Date Finished / Empty
          <input type="date" id="pu-date-finished">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="purchase-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/inventoryItem.js"></script>
</body>
</html>
