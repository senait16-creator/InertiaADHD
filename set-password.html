<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a password — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="auth-screen">
    <h1>Set a password</h1>
    <p class="subtitle">
      One-time setup for your existing account — after this, sign in with
      your email and password instead of an emailed code.
    </p>

    <form id="password-form" class="auth-form">
      <label>
        New password
        <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
      </label>
      <button type="submit" class="btn-primary">Save password</button>
    </form>

    <p id="status" class="auth-status"></p>
  </main>

  <script type="module" src="js/setPassword.js"></script>
</body>
</html>
