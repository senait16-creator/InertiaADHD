<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="auth-screen">
    <h1>InertiaADHD</h1>
    <p class="subtitle">Sign in to open your dashboard.</p>

    <form id="email-form" class="auth-form">
      <label>
        Email
        <input type="email" id="email" required autocomplete="email">
      </label>
      <button type="submit" class="btn-primary">Send code</button>
    </form>

    <form id="code-form" class="auth-form" hidden>
      <label>
        6-digit code
        <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
      </label>
      <button type="submit" class="btn-primary">Verify</button>
      <button type="button" id="resend-code" class="btn-secondary">Use a different email</button>
    </form>

    <p id="status" class="auth-status"></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
