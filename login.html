<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="auth-screen">
    <h1>InertiaADHD</h1>
    <p class="subtitle">Sign in to open your dashboard.</p>

    <form id="login-form" class="auth-form">
      <label>
        Email
        <input type="email" id="email" required autocomplete="email">
      </label>
      <label>
        Password
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p id="status" class="auth-status"></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
