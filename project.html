<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="project-page">
    <a href="projects.html" class="back-link" id="back-link">‹ Back</a>

    <div class="project-header">
      <div class="icon-badge-lg" id="project-icon-display" data-color="sage">📁</div>
      <h1 id="project-name-display">Project</h1>
      <p class="project-status-display" id="project-status-display"></p>
    </div>

    <div class="project-body" id="project-body">
      <p class="project-placeholder">Project workspace coming next.</p>
    </div>
    <div id="routine-board-mount" hidden></div>

    <div class="project-actions">
      <button class="btn-secondary" id="edit-project-btn" type="button">Edit Project</button>
      <button class="btn-danger" id="delete-project-btn" type="button">Delete Project</button>
    </div>
  </main>

  <div class="modal-overlay" id="edit-project-modal">
    <div class="modal">
      <h2>Edit Project</h2>
      <form id="edit-project-form">
        <label>
          Project name
          <input type="text" id="edit-name" required maxlength="80" autocomplete="off">
        </label>
        <div class="field">
          <span class="field-label">Icon</span>
          <div class="icon-picker" id="edit-icon-picker" role="radiogroup" aria-label="Project icon"></div>
        </div>
        <label>
          Status (optional)
          <input type="text" id="edit-status" maxlength="60" autocomplete="off">
        </label>
        <div class="field">
          <span class="field-label">Color (optional)</span>
          <div class="color-picker" id="edit-color-picker" role="radiogroup" aria-label="Project color">
            <button type="button" class="color-swatch" data-color="sage" role="radio" aria-checked="true" aria-label="Sage"></button>
            <button type="button" class="color-swatch" data-color="green" role="radio" aria-checked="false" aria-label="Green"></button>
            <button type="button" class="color-swatch" data-color="blue" role="radio" aria-checked="false" aria-label="Blue"></button>
            <button type="button" class="color-swatch" data-color="amber" role="radio" aria-checked="false" aria-label="Amber"></button>
            <button type="button" class="color-swatch" data-color="lavender" role="radio" aria-checked="false" aria-label="Lavender"></button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/project.js"></script>
</body>
</html>
