<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Products — InertiaADHD</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#5c8a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InertiaADHD">
</head>
<body>
  <main class="dashboard">
    <a href="maintenance.html" class="back-link">‹ Maintenance</a>

    <header class="dashboard-header">
      <h1 id="page-title">Products</h1>
      <p class="subtitle">How the products you own are used in this routine — see Inventory for ownership details.</p>
    </header>

    <a href="#" class="link-chip" id="routine-link" style="margin-bottom:0.9rem; display:inline-flex;"></a>
    <p class="insight-line" id="cost-summary" hidden></p>

    <div class="stack" id="usage-list"></div>
    <p class="subtitle" id="empty-note" hidden>Nothing used here yet.</p>
    <button type="button" class="add-row-btn" id="add-usage-btn">+ Use an Inventory Item</button>
  </main>

  <div class="modal-overlay" id="add-usage-modal">
    <div class="modal">
      <h2>Use an Inventory Item</h2>
      <div class="stack" id="pick-item-list"></div>
      <p class="field-note" id="pick-item-empty" hidden>Every item you own in this category is already in use here.</p>
      <a href="#" class="link-chip" id="add-new-item-link" style="margin-top:0.8rem; display:inline-flex;"></a>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="add-usage-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/maintenanceProducts.js"></script>
</body>
</html>
